name: CI/CD Pipeline

# Trigger on push to 5-services-extension branch
on:
  push:
    branches:
      - 5-services-extension
  pull_request:
    branches:
      - 5-services-extension

jobs:
  # Job 1: Build and Test Services
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build User Service
        working-directory: ./user-service
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Event Service
        working-directory: ./event-service
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Booking Service
        working-directory: ./booking-service
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: microservices-jars
          path: |
            user-service/target/*.jar
            event-service/target/*.jar
            booking-service/target/*.jar
          retention-days: 5

  # Job 2: Build Docker Images
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build User Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: false
          tags: event-management-user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Event Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./event-service
          file: ./event-service/Dockerfile
          push: false
          tags: event-management-event-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Booking Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./booking-service
          file: ./booking-service/Dockerfile
          push: false
          tags: event-management-booking-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Deploy to Local Environment
  deploy:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create deployment environment
      - name: Set up Docker Compose
        run: |
          docker --version
          docker-compose --version

      - name: Validate Docker Compose Configuration
        run: |
          docker-compose config

      # Start services
      - name: Deploy Services with Docker Compose
        run: |
          echo "Starting deployment..."
          docker-compose up -d --build
          echo "Waiting for services to start..."
          sleep 30

      - name: Health Check - User Service
        run: |
          curl --fail http://localhost:8081/api/auth/health || exit 1
          echo "User Service is healthy"

      - name: Health Check - Event Service
        run: |
          curl --fail http://localhost:8082/api/events/health || exit 1
          echo "Event Service is healthy"

      - name: Health Check - Booking Service
        run: |
          curl --fail http://localhost:8083/api/bookings/health || exit 1
          echo "Booking Service is healthy"

      - name: Health Check - RabbitMQ
        run: |
          curl --fail http://localhost:15672 || exit 1
          echo "RabbitMQ is healthy"

      - name: Show Running Containers
        run: |
          echo "Running containers:"
          docker ps

      - name: Show Service Logs
        if: failure()
        run: |
          echo "User Service Logs:"
          docker logs user-service --tail 50
          echo "Event Service Logs:"
          docker logs event-service --tail 50
          echo "Booking Service Logs:"
          docker logs booking-service --tail 50

      - name: Cleanup
        if: always()
        run: |
          docker-compose down -v
          echo "Cleanup completed"

  # Job 4: Notify Success
  notify:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker, deploy]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "=============================="
          echo " 🎉 CI/CD Pipeline Completed! "
          echo "=============================="
          echo "Build Status: Success"
          echo "Docker Images: Built"
          echo "Deployment: Verified"
          echo "Health Checks: Passed"