server:
  port: 8082

spring:
  application:
    name: event-service
  
  datasource:
    url: jdbc:postgresql://localhost:5434/event_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Feign Client Configuration for User Service
user-service:
  url: http://user-service:8081

# Logging
logging:
  level:
    com.eventmanagement: DEBUG
    org.springframework.web: INFO
    org.springframework.cloud.openfeign: DEBUG